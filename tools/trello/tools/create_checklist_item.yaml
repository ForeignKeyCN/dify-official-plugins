description:
  human:
    en_US: Creates a new item within a Trello checklist identified by its ID, with an
      optional checked state and position.
    pt_BR: Cria um novo item dentro de uma lista de verificação Trello identificada
      por seu ID, com um estado marcado e posição opcionais.
    zh_Hans: 在由 ID 标识的 Trello 清单中创建新条目，可选择设置勾选状态和位置。
  llm: Add a new item to a specific Trello checklist by providing the checklist ID and
    item name, optionally setting its checked state and position.
extra:
  python:
    source: tools/create_checklist_item.py
identity:
  author: langgenius
  label:
    en_US: Create Checklist Item
    pt_BR: Criar Item de Lista de Verificação
    zh_Hans: 创建清单条目
  name: create_checklist_item
parameters:
- form: llm
  human_description:
    en_US: The unique identifier of the Trello checklist to add the item to.
    pt_BR: O identificador único da lista de verificação Trello à qual adicionar o item.
    zh_Hans: 要添加条目的 Trello 清单的唯一标识符。
  label:
    en_US: Checklist ID
    pt_BR: ID da Lista de Verificação
    zh_Hans: 清单 ID
  llm_description: Input the ID of the Trello checklist where the item should be created.
  name: id
  required: true
  type: string
- form: llm
  human_description:
    en_US: The name of the checklist item to create.
    pt_BR: O nome do item de lista de verificação a ser criado.
    zh_Hans: 要创建的清单条目的名称。
  label:
    en_US: Item Name
    pt_BR: Nome do Item
    zh_Hans: 条目名称
  llm_description: Provide a name for the checklist item to be created.
  name: name
  required: true
  type: string
- form: llm
  human_description:
    en_US: Optional. Set to true if the item should be marked as checked, or false
      if unchecked.
    pt_BR: Opcional. Defina como true se o item deve ser marcado como concluído, ou
      false se não marcado.
    zh_Hans: 可选。如果条目应标记为已勾选，则设置为 true；如果未勾选，则设置为 false。
  label:
    en_US: Checked
    pt_BR: Marcado
    zh_Hans: 已勾选
  llm_description: Indicate whether the checklist item should be marked as checked or
    unchecked.
  name: checked
  required: false
  type: boolean
- form: llm
  human_description:
    en_US: Optional. The position of the item in the checklist. Can be 'top', 'bottom',
      or a positive number.
    pt_BR: Opcional. A posição do item na lista de verificação. Pode ser 'top', 'bottom'
      ou um número positivo.
    zh_Hans: 可选。条目在清单中的位置。可以是“top”、“bottom” 或正数。
  label:
    en_US: Position
    pt_BR: Posição
    zh_Hans: 位置
  llm_description: Specify the position of the item within the checklist, either at
    the top, bottom, or a specific numerical index.
  name: pos
  required: false
  type: string

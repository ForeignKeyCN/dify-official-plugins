description:
  human:
    en_US: Adds an attachment to a Trello card by providing a URL. Optionally, a display
      name can be set for the attachment.
    pt_BR: Adiciona um anexo a um cartão Trello fornecendo uma URL. Opcionalmente,
      um nome de exibição pode ser definido para o anexo.
    zh_Hans: 通过提供 URL 向 Trello 卡片添加附件。可选择为附件设置显示名称。
  llm: Attach an external resource to a Trello card by providing the card ID and the
    attachment URL, with an optional display name for the attachment.
extra:
  python:
    source: tools/add_attachment_to_card.py
identity:
  author: langgenius
  label:
    en_US: Add Attachment to Card
    pt_BR: Adicionar Anexo ao Cartão
    zh_Hans: 向卡片添加附件
  name: add_attachment_to_card
parameters:
- form: llm
  human_description:
    en_US: The unique identifier of the Trello card to add the attachment to.
    pt_BR: O identificador único do cartão Trello ao qual adicionar o anexo.
    zh_Hans: 要添加附件的 Trello 卡片的唯一标识符。
  label:
    en_US: Card ID
    pt_BR: ID do Cartão
    zh_Hans: 卡片 ID
  llm_description: Input the ID of the Trello card where the attachment should be added.
  name: id
  required: true
  type: string
- form: llm
  human_description:
    en_US: The URL of the resource to attach to the card.
    pt_BR: A URL do recurso a ser anexado ao cartão.
    zh_Hans: 要附加到卡片的资源的 URL。
  label:
    en_US: Attachment URL
    pt_BR: URL do Anexo
    zh_Hans: 附件 URL
  llm_description: Provide the URL of the resource to attach to the card.
  name: url
  required: true
  type: string
- form: llm
  human_description:
    en_US: Optional. A display name for the attachment.
    pt_BR: Opcional. Um nome de exibição para o anexo.
    zh_Hans: 可选。附件的显示名称。
  label:
    en_US: Attachment Name
    pt_BR: Nome do Anexo
    zh_Hans: 附件名称
  llm_description: Optionally specify a display name for the attachment.
  name: name
  required: false
  type: string

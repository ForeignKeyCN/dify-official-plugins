identity:
  name: checklist_item_created
  author: langgenius
  label:
    en_US: Checklist Item Created
    zh_Hans: 检查项创建
    ja_JP: チェックリスト項目作成
    ko_KR: 체크리스트 항목 생성
description:
  en_US: Fires when a checklist item is created on a card.
  zh_Hans: 当在卡片上创建检查项时触发。
  ja_JP: カードにチェックリスト項目が作成されたときに発火します。
  ko_KR: 카드에 체크리스트 항목이 생성될 때 실행됩니다.
parameters: []
output_schema:
  type: object
  properties:
    model:
      type: object
      description: The board the webhook is attached to.
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    action:
      type: object
      description: The Trello action that triggered this event.
      properties:
        id:
          type: string
        type:
          type: string
        date:
          type: string
          format: date-time
        idMemberCreator:
          type: string
        memberCreator:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            fullName:
              type: string
            avatarUrl:
              type:
              - string
              - "null"
        data:
          type: object
          properties:
            checkItem:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                state:
                  type: string
            checklist:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            card:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                idShort:
                  type: integer
                shortLink:
                  type: string
            board:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                shortLink:
                  type: string
      required:
      - id
      - type
      - data
  required:
  - action
extra:
  python:
    source: events/checklist_item_created/checklist_item_created.py

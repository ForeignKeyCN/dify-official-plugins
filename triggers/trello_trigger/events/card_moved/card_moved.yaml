identity:
  name: card_moved
  author: langgenius
  label:
    en_US: Card Moved
    zh_Hans: 卡片移动
    ja_JP: カード移動
    ko_KR: 카드 이동
description:
  en_US: Fires when a card is moved from one list to another.
  zh_Hans: 当卡片从一个列表移动到另一个列表时触发。
  ja_JP: カードがあるリストから別のリストへ移動されたときに発火します。
  ko_KR: 카드가 한 목록에서 다른 목록으로 이동될 때 실행됩니다.
parameters: []
output_schema:
  type: object
  properties:
    model:
      type: object
      description: The board the webhook is attached to.
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
    action:
      type: object
      description: The Trello action that triggered this event.
      properties:
        id:
          type: string
        type:
          type: string
        date:
          type: string
          format: date-time
        idMemberCreator:
          type: string
        memberCreator:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            fullName:
              type: string
            avatarUrl:
              type:
              - string
              - "null"
        data:
          type: object
          properties:
            card:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                idShort:
                  type: integer
                shortLink:
                  type: string
            listBefore:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            listAfter:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            board:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                shortLink:
                  type: string
      required:
      - id
      - type
      - data
  required:
  - action
extra:
  python:
    source: events/card_moved/card_moved.py
